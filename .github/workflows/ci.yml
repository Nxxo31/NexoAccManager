name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      is-node: ${{ steps.detect.outputs.is-node }}
      is-go: ${{ steps.detect.outputs.is-go }}
      is-python: ${{ steps.detect.outputs.is-python }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f package.json ]; then
            echo "is-node=true" >> $GITHUB_OUTPUT
          else
            echo "is-node=false" >> $GITHUB_OUTPUT
          fi
          if [ -f go.mod ]; then
            echo "is-go=true" >> $GITHUB_OUTPUT
          else
            echo "is-go=false" >> $GITHUB_OUTPUT
          fi
          if [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f setup.py ]; then
            echo "is-python=true" >> $GITHUB_OUTPUT
          else
            echo "is-python=false" >> $GITHUB_OUTPUT
          fi

  # 1.4 — gitleaks step scanning staged diff on every PR
  gitleaks:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Scan diff for secrets on every PR
        run: |
          # Scan the full diff introduced by this PR vs the base branch.
          # --source . scans the working tree; --log-opts restricts to the PR's commits.
          # Uses gitleaks built-in default ruleset (--config is omitted).
          gitleaks detect \
            --source . \
            --no-banner \
            --redact \
            --verbose \
            --log-opts "--no-merges --first-parent ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --report-format json \
            --report-path .gitleaks-report.json \
            || exit 1
      - name: Upload findings on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-findings
          path: .gitleaks-report.json

  # 1.3 — IPC drift check job running the channel extractor script
  # Fails the build if preload ↔ handler ↔ window-api.d.ts drift != 0.
  ipc-drift-check:
    needs: detect
    if: needs.detect.outputs.is-node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: IPC channel drift detection
        run: npx tsx scripts/extract-ipc-channels.ts

  compile-node:
    needs: detect
    if: needs.detect.outputs.is-node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  compile-go:
    needs: detect
    if: needs.detect.outputs.is-go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

  compile-python:
    needs: detect
    if: needs.detect.outputs.is-python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
      - name: Compile check
        run: python -m py_compile $(find . -name "*.py" -not -path "./.venv/*" -not -path "./venv/*")
